version: "2"
sql:
  - engine: "postgresql"
    schema: "database/migrations/"
    queries: "database/queries/"
    gen:
      go:
        package: "db"
        out: "database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
